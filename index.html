<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover가 있어야 env(safe-area-inset-*)가 0이 아닌 값을 준다.
     maximum-scale·user-scalable=no를 넣지 않는다 — 안드로이드 크롬이 그걸 지켜서 확대가 막힌다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>명대사 월드컵 — 내가 연기해보고 싶은 장면 | acttub</title>
<meta name="description" content="연기해보고 싶은 장면만 남기는 16강 토너먼트. 마지막에 남은 한 장면이 품은 질문을 만나보세요.">
<link rel="canonical" href="https://pick.acttub.com/">

<meta property="og:type" content="website">
<meta property="og:url" content="https://pick.acttub.com/">
<meta property="og:title" content="명대사 월드컵 — 내가 연기해보고 싶은 장면">
<meta property="og:description" content="16개의 장면 중, 끝까지 남길 한 장면은?">
<meta property="og:image" content="https://pick.acttub.com/og.jpg">
<meta property="og:site_name" content="acttub">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">

<!-- 방문 계측. vercel.json이 catch-all 폴백을 쓰지 않는 이유가 이 경로다 —
     폴백이 /_vercel/* 를 삼키면 이 스크립트가 404가 되고 계측이 조용히 죽는다. -->
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="bg-neutral text-ink font-sans antialiased">

<!-- 문장은 전부 copy.js에서 주입한다. 이 파일에는 화면 골격만 둔다.
     tier-root / tier-shell은 brand/responsive-base.css의 3단 티어 셸이다
     (phone 화면−40 · tablet 560 · desktop 760). 폭을 여기서 다시 정하지 않는다. -->
<div class="tier-root">

<!-- 화면이 바뀌어도 움직이지 않는 지속 요소다. 등장 모션을 주지 않는다.
     .tier-shell 밖에 둬서 흰 면이 화면 폭을 꽉 채운다 — 안쪽 .topbar-in이
     같은 --gutter/--content-max를 쓰므로 아래 본문과 왼쪽 선이 맞는다. -->
<header class="topbar">
  <div class="topbar-in">
    <span class="wordmark" data-copy="brand.wordmark"></span>
    <span class="session-name" data-copy="brand.service"></span>
  </div>
</header>

<div class="tier-shell pt-lg">

  <section id="screen-start" hidden>
    <div class="rise mt-xl">
      <h1 class="text-h1" data-copy-html="start.title"></h1>
      <p class="mt-md text-body-md text-ink-sub" data-copy-html="start.lead"></p>
    </div>

    <div id="friend-note" class="card mt-lg p-[20px]" hidden>
      <div class="text-label text-primary-strong" data-copy="friend.label"></div>
      <div id="friend-scene" class="mt-sm text-subtitle font-bold"></div>
      <div class="mt-sm text-body-md text-ink-sub" data-copy="friend.ask"></div>
    </div>

    <!-- 16장 중 한 장을 미리 보여준다. 뒤에 반투명 카드를 겹쳐 "더 있다"를 표시했었지만
         회색 배경 위에서 흰 반투명 띠가 렌더 이음새처럼 보였다. 장수는 lead 문장이
         이미 말하므로(16개의 장면이 있어요) 그림으로 다시 말하지 않는다. -->
    <div id="peek-card" class="card mt-xl p-[20px]"></div>

    <div class="mt-xl">
      <button id="btn-start" class="btn btn-primary" data-copy="start.button"></button>
    </div>
    <p class="mt-md text-label text-ink-sub" data-copy="start.notice"></p>
  </section>

  <section id="screen-match" hidden>
    <!-- 라운드 이름은 사다리 위치, 진행바·카운터는 전체 15경기 중 어디쯤인지를 말한다.
         둘이 다른 것을 세므로 카운터도 전체 기준으로 맞춘다 — 섞으면 바와 숫자가 어긋난다. -->
    <div class="mt-lg">
      <div class="flex items-center justify-between">
        <span id="round-name" class="text-body-md font-bold text-ink"></span>
        <span id="round-count" class="text-body-sm font-semibold text-ink-sub"></span>
      </div>
      <div class="mt-sm h-[6px] w-full overflow-hidden rounded-pill bg-line">
        <div id="progress-fill" class="h-full rounded-pill bg-primary-strong transition-[width] duration-200 ease-out" style="width: 0%"></div>
      </div>
    </div>

    <h2 class="mt-lg text-h3" data-copy="match.question"></h2>

    <div class="mt-md flex flex-col gap-sm desktop:flex-row desktop:items-stretch">
      <button id="card-a" class="card tappable block w-full border-0 p-[20px] text-left font-sans text-ink hover:bg-surface-sub desktop:w-auto desktop:flex-1"></button>
      <div class="vs-mark self-center" data-copy="match.vs"></div>
      <button id="card-b" class="card tappable block w-full border-0 p-[20px] text-left font-sans text-ink hover:bg-surface-sub desktop:w-auto desktop:flex-1"></button>
    </div>
  </section>

  <section id="screen-result" hidden>
    <!-- 우승 장면은 흰 카드가 아니라 세로선 표식으로 세운다. 화면의 강조를 하나로 두려면
         카드가 둘이면 안 된다 — 되비춤 카드가 유일한 카드다. -->
    <div class="mt-xl">
      <p class="text-label text-primary-strong" data-copy="result.eyebrow"></p>
      <!-- 글자를 키워서 주인공을 만들지 않는다. brand/TASTE.md에서 22px안(D1)은 기각됐고
           16px + 맨 윗자리 + 파란 세로선(D2)이 채택됐다. 코어웹 재설계본의
           연습 노트 문장(.lead .sent = 16px/600)과 같은 크기다. -->
      <div class="winner-mark mt-sm">
        <p id="winner-line" class="text-body-lg font-semibold"></p>
        <p id="winner-source" class="mt-xs text-body-sm font-semibold text-ink-sub"></p>
      </div>
      <p id="winner-situation" class="mt-md text-body-md text-ink-sub"></p>
    </div>

    <div class="card mt-xl p-[20px]">
      <p id="reflect-intro" class="text-subtitle"></p>
      <p class="mt-lg text-label text-primary-strong" data-copy="result.questionLabel"></p>
      <ul id="reflect-questions" class="dot-list mt-md"></ul>
      <!-- 카드 안에서 색을 갖는 덩어리는 이것 하나뿐이다. 마지막에 시선이 여기서 멈춘다. -->
      <p class="softnote mt-lg" data-copy="result.ownership"></p>
    </div>

    <!-- 이 문장은 바로 아래 코어 버튼이 무엇인지 설명한다. 둘을 떼어놓지 않는다. -->
    <p class="mt-xl text-body-md text-ink-sub" data-copy="result.bridge"></p>

    <!-- 코어로 가는 버튼만 전폭이다. 저장·공유는 자동 폭으로 한 줄에 놓아
         "다음 행동 하나 + 곁들이 둘"이 모양으로 읽히게 한다. -->
    <a id="btn-core" class="btn btn-primary btn-block mt-md" data-copy="result.buttons.core" href="#" rel="noopener"></a>
    <!-- grow + basis-[200px]: 폭이 되면 둘이 같은 너비로 한 줄에 서고, 안 되면 각자 전폭으로
         내려간다. 자동 폭 그대로 두면 줄바꿈된 뒤 길이가 제각각인 계단이 생긴다. -->
    <div class="mt-sm flex flex-wrap gap-sm">
      <button id="btn-save"  class="btn btn-secondary grow basis-[200px]" data-copy="result.buttons.save"></button>
      <button id="btn-share" class="btn btn-secondary grow basis-[200px]" data-copy="result.buttons.share"></button>
    </div>
    <div class="mt-sm">
      <button id="btn-retry" class="btn-quiet" data-copy="result.buttons.retry"></button>
    </div>
  </section>

  <footer class="mt-xxl pb-xl">
    <p class="text-label leading-normal text-ink-sub">
      <span data-copy="footer.line1"></span><br>
      <span data-copy="footer.line2"></span>
    </p>
    <a id="link-insta" class="inline-flex min-h-[44px] items-center text-body-sm font-semibold text-primary-strong no-underline"
       href="https://www.instagram.com/acttub_com" target="_blank" rel="noopener"
       data-copy="footer.instagram"></a>
  </footer>

</div>
</div>

<div id="toast"
     class="pointer-events-none fixed bottom-xl left-1/2 -translate-x-1/2 rounded-pill bg-ink px-[20px] py-[10px] text-body-md text-white opacity-0 transition-opacity duration-200"
     style="box-shadow: 0 8px 24px rgb(0 0 0 / 0.16);"></div>

<canvas id="share-canvas" width="1080" height="1350" hidden></canvas>

<script src="/copy.js"></script>
<script src="/data.js"></script>
<script src="/app.js"></script>
</body>
</html>
